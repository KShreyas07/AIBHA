services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bha_password}
      POSTGRES_DB: ${POSTGRES_DB:-bha_db}
    volumes:
      - bha_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bha_user} -d ${POSTGRES_DB:-bha_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bha_user}:${POSTGRES_PASSWORD:-bha_password}@db:5432/${POSTGRES_DB:-bha_db}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-64-char-secret}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - bha_uploads:/app/uploads
      - bha_reports:/app/reports
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-8000}/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"

volumes:
  bha_postgres_data:
  bha_uploads:
  bha_reports:
